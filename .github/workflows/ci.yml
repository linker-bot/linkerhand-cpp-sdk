name: SDK package
on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: SDK package (${{ matrix.container || matrix.os }}, transport=${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            container: ''
            transport: 'OFF'
          - os: ubuntu-24.04
            container: ''
            transport: 'ON'
          - os: ubuntu-24.04-arm
            container: ''
            transport: 'OFF'
          - os: ubuntu-24.04-arm
            container: ''
            transport: 'ON'
          - os: windows-2022
            container: ''
            transport: 'OFF'
          - os: windows-2022
            container: ''
            transport: 'ON'
          - os: ubuntu-24.04
            container: ubuntu:20.04
            transport: 'OFF'
          - os: ubuntu-24.04
            container: ubuntu:22.04
            transport: 'OFF'
    steps:
      - name: Prepare compatibility container
        if: matrix.container != ''
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake g++ make python3 tar
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.transport == 'ON'
        with:
          repository: linker-bot/linkerbot-transport-cpp
          ref: ff429d0c0333120dd6867ee7247549e53934ed46
          path: transport-source
      - name: Configure package consumers
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=ON -DBUILD_TESTING=ON \
            -DLINKERHAND_USE_TRANSPORT=${{ matrix.transport }} \
            -DLINKERHAND_TRANSPORT_SOURCE_DIR="$GITHUB_WORKSPACE/transport-source" \
            -DLINKERBOT_TRANSPORT_ENABLE_SERIAL=OFF -DLINKERBOT_TRANSPORT_ENABLE_MODBUS=OFF
      - name: Build read-only consumer and SDK tests
        run: cmake --build build --config Release --parallel 4
      - name: Run offline SDK tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install and build an independent consumer
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/install"
          cmake -S demo -B consumer -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"
          cmake --build consumer --config Release --parallel 4
      - name: Check Linux build wrapper
        if: matrix.os == 'ubuntu-24.04' && matrix.container == '' && matrix.transport == 'OFF'
        run: bash build.sh --test
      - name: Check Windows build wrapper
        if: matrix.os == 'windows-2022' && matrix.transport == 'OFF'
        shell: cmd
        run: call build.bat -t --compiler msvc
      - name: Record binary provenance
        shell: bash
        run: python3 tools/binary_manifest.py > binary-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: SDK-manifest-${{ strategy.job-index }}
          path: binary-manifest.json
